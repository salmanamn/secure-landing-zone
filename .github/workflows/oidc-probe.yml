name: oidc-probe

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    probe:
        runs-on: ubuntu-latest
        steps:
            - name: Print OIDC claims (never the token)
              run: |
                  set -euo pipefail
                  TOKEN=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                    "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)
                  echo "::add-mask::${TOKEN}"
                  P=$(cut -d. -f2 <<<"$TOKEN" | tr '_-' '/+')
                  while (( ${#P} % 4 )); do P="${P}="; done
                  base64 -d <<<"$P" | jq '{sub, repository_id, repository_owner_id}'
