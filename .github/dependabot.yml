version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: ["/envs/azure", "/envs/local", "/bootstrap", "/platform"]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"] # stay on 4.x until floci-az supports 5.x
